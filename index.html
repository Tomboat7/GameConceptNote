<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ゲーム企画ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 方眼ノートの上に、左=ステップ目次 / 中央=質問フォーム / 右=1枚に組み上がる企画書 */
:root{
  --paper:#EEF1F6; --sheet:#FFFFFF; --ink:#18203A; --ink-2:#4F5979; --rule:#D3D9E6;
  --grid:rgba(36,72,201,.07); --cobalt:#2448C9; --cobalt-ink:#FFFFFF; --soft:#E4E9F6;
  --marker:#FFE066; --marker-ink:#18203A; --ok:#1F7F55; --warn:#A55F00; --focus:#2448C9;
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10141F; --sheet:#171D2C; --ink:#E4E8F3; --ink-2:#9CA5C1; --rule:#2B3452;
  --grid:rgba(143,162,255,.06); --cobalt:#8FA2FF; --cobalt-ink:#0E1430; --soft:#202941;
  --marker:#E9C84A; --marker-ink:#17130A; --ok:#55C792; --warn:#E5A646; --focus:#8FA2FF; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#10141F; --sheet:#171D2C; --ink:#E4E8F3; --ink-2:#9CA5C1; --rule:#2B3452;
  --grid:rgba(143,162,255,.06); --cobalt:#8FA2FF; --cobalt-ink:#0E1430; --soft:#202941;
  --marker:#E9C84A; --marker-ink:#17130A; --ok:#55C792; --warn:#E5A646; --focus:#8FA2FF; color-scheme:dark }

*{box-sizing:border-box}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.topbar{max-width:1440px;margin:0 auto;padding:18px 16px 10px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.02em}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.08em}
.docbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.docbar select{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;max-width:240px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px;line-height:1.4}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt);font-weight:700}
.btn.danger-armed{border-color:var(--warn);color:var(--warn)}

.banner{max-width:1440px;margin:0 auto 8px;padding:0 16px}
.banner > div{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:8px 14px;font-size:14px}
.banner button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:13px}

.viewtoggle{display:none;max-width:1440px;margin:0 auto;padding:0 16px 10px;gap:6px}
.viewtoggle button{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:8px;border-radius:6px;cursor:pointer;font-weight:500}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.app{max-width:1440px;margin:0 auto;padding:4px 16px 48px;display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,460px);gap:24px;align-items:start}

/* Step nav */
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.steps button:hover{background:var(--soft)}
.steps button[aria-current="step"]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--cobalt);font-weight:700}
.steps .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.steps .p{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.steps .p.full{color:var(--ok)}
.overall{margin-top:14px;padding:10px 8px 0;border-top:1px dashed var(--rule);font-size:12px;color:var(--ink-2)}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--cobalt);width:0;transition:width .3s}

/* Form */
.form{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:28px clamp(16px,4vw,36px) 28px;min-width:0}
.sec-head .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--cobalt);margin:0}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3vw,30px);line-height:1.3;margin:4px 0 6px;text-wrap:balance}
.sec-head .lead{margin:0 0 18px;color:var(--ink-2);max-width:62ch}
.idea{border-left:3px solid var(--marker);background:var(--soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:0 0 26px;font-size:14px;max-width:70ch}
.idea .idea-name{font-weight:700;margin:0 0 4px}
.idea p{margin:0}
.idea ul{margin:8px 0 0;padding-left:1.2em}
.fields{display:flex;flex-direction:column;gap:24px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-weight:700;font-size:15px}
.hint{font-size:13px;color:var(--ink-2);margin:-2px 0 2px;max-width:62ch}
input[type=text],input[type=url],input[type=password],input[type=date],textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 12px;line-height:1.6}
textarea{resize:vertical;min-height:64px}
input[type=text]:focus,input[type=url]:focus,input[type=password]:focus,input[type=date]:focus,textarea:focus{background:var(--sheet);border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 18%,transparent)}
::placeholder{color:var(--ink-2);opacity:.6}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:center}
.row .idx{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);width:22px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.row input{flex:1;min-width:0}
.icon{flex:none;width:32px;height:32px;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;cursor:pointer;color:var(--ink-2);line-height:1;padding:0}
.icon:hover{color:var(--ink);border-color:var(--ink-2)}
.icon:disabled{opacity:.35;cursor:default}
.add{align-self:flex-start;border:1px dashed var(--rule);background:transparent;border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--cobalt);font-size:14px}
.add:hover{border-color:var(--cobalt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;text-align:left;font-size:14px;line-height:1.35}
.chip small{display:block;font-size:11.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.chip[aria-pressed="true"] small{color:var(--marker-ink);opacity:.75}
.chips.rich .chip{border-radius:8px;padding:8px 12px;flex:1 1 150px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative}
.card .full{grid-column:1/-1}
.card label{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px;min-width:0}
.card-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.loopviz{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px;border:1px dashed var(--rule);border-radius:8px;font-size:14px}
.loopviz .st{background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:999px}
.loopviz .ar{color:var(--ink-2)}
.loopviz .back{color:var(--cobalt);font-family:var(--f-mono);font-size:12px}
.loopviz .empty{color:var(--ink-2);font-size:13px}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:32px;padding-top:18px;border-top:1px solid var(--rule)}

/* Finish */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-size:14px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.warn{color:var(--warn)} .tag.tip{color:var(--cobalt)} .tag.ok{color:var(--ok)}
.checks .jump{border:0;background:transparent;color:var(--cobalt);cursor:pointer;font-size:13px;white-space:nowrap;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:3px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sheet);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.out{font-family:var(--f-mono);font-size:12.5px;line-height:1.6;min-height:260px}
.exp-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.imp summary{cursor:pointer;color:var(--ink-2);font-size:14px}
details.imp .field{margin-top:10px}

/* Preview sheet */
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;min-width:0}
.pv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-2)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(20,30,70,.35);padding:26px 26px 32px;overflow:auto;font-size:13.5px;line-height:1.7;min-height:0}
.sheet h1{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.3;margin:0 0 10px;text-wrap:balance}
.sheet h2{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.12em;color:var(--cobalt);margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.sheet h3{font-size:14px;margin:12px 0 2px}
.sheet p{margin:4px 0}
.sheet ul,.sheet ol{margin:4px 0;padding-left:1.3em}
.sheet blockquote{margin:0 0 6px;padding:8px 12px;background:var(--marker);color:var(--marker-ink);border-radius:4px;font-weight:500}
.sheet strong{font-weight:700}
.sheet .empty-doc{color:var(--ink-2);text-align:center;padding:40px 0}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:10}

/* ---------- v2: genre questions / review / mood board / playtests / compare / share / print ---------- */
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:transparent;color:var(--cobalt);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.gsug{font-size:13px;background:var(--soft);border-radius:6px;padding:6px 10px;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.gq{border:1px dashed var(--cobalt);border-radius:8px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:16px;margin-top:24px}
.gq-name{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--cobalt);margin:0}
.gq .label{font-size:14px}
.tag.q{color:var(--marker-ink);background:var(--marker);border-color:var(--marker)}
.checks .ops{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.checks .jump.mute{color:var(--ink-2)}
.notice{background:var(--soft);border-radius:6px;padding:10px 14px;font-size:13px;margin:0;max-width:70ch}
.notice.warn{border-left:3px solid var(--warn)}
.notice ul{margin:4px 0 0;padding-left:1.2em}
fieldset.checkrow{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
fieldset.checkrow legend{font-size:13px;color:var(--ink-2);padding:0;margin-bottom:4px}
.checkrow label,.pv-tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--cobalt);width:16px;height:16px;margin:0}
.label.sm{font-size:13px}
.share-url{font-family:var(--f-mono);font-size:12px}
.mood-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mood-add input{flex:1 1 220px;min-width:0}
.mood-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mood{border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;margin:0;background:var(--sheet);min-width:0}
.mood .thumb{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-2);font-size:12px;text-align:center;padding:8px}
.mood .thumb:has(img){padding:0}
.mood .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mood .mbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.mood .mhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.mood .mhead .mk{font-family:var(--f-mono);flex:1}
.mood .mhead a{color:var(--cobalt)}
.mood .mhead .icon{width:28px;height:28px}
.mood input[type=text],.mood textarea{font-size:13px;padding:6px 8px}
.mood-grid.sm{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}
.mood figcaption{padding:6px 8px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.mood figcaption a{color:inherit}
.card .sublabel{font-size:12px;color:var(--ink-2);display:block;margin-bottom:4px}
.card .chips .chip{padding:4px 12px;font-size:13px}
.pt-send{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pt-send .sublabel{width:100%;margin:0}
.pv-tools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:0 4px 10px;font-size:12.5px;color:var(--ink-2)}
.pv-tools .btn{margin-left:auto}
.sheet .appendix{margin-top:26px;padding-top:4px;border-top:2px solid var(--ink)}
.cmp{max-width:1440px;margin:0 auto;padding:4px 16px 48px}
.cmp-in{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:28px clamp(16px,4vw,36px)}
.cmp-legend{font-size:13px;color:var(--ink-2);margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cg{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.cg-row{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:start}
.cg-l{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dmark{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--marker);color:var(--marker-ink);border-radius:4px;padding:1px 6px}
.cg-c{min-width:0;font-size:14px;display:flex;flex-direction:column;gap:8px}
.cg-top select{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;width:100%;font-weight:700}
.cg .none{color:var(--ink-2)}
.chipset{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ci{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:13px}
.ci.only{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.chipset .ar{color:var(--ink-2)}
.cg-judge .btn{align-self:flex-start}
body.comparing .app,body.comparing .viewtoggle,body.comparing .banner{display:none!important}
.viewer{max-width:900px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:14px}
.vbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 16px}
.vbar > div:first-child{display:flex;flex-direction:column}
.vpw{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:8px}
body.viewing .docbar,body.viewing .banner,body.viewing .viewtoggle,body.viewing .app,body.viewing .cmp{display:none!important}
.viewer .sheet{max-height:none;overflow:visible}
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:22px;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,14,30,.45)}
.dlg{display:flex;flex-direction:column;gap:8px}
.dlg h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px}
.dlg .exp-actions{justify-content:flex-end;margin-top:8px}
@media (max-width:720px){
  .cg-row{grid-template-columns:minmax(0,1fr);gap:6px}
  .cg-c::before{content:attr(data-side);font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
  .cg-top .cg-l{display:none}
}
@media print{
  @page{size:A4;margin:9mm 10mm}
  :root,:root[data-theme]{color-scheme:light!important;--paper:#fff!important}
  html,body{background:#fff!important;background-image:none!important;color:#18203A!important}
  .topbar,.banner,.viewtoggle,.steps,.form,.toast,.pv-head,.pv-tools,.vbar,.vpw,.cmp,dialog{display:none!important}
  .app{display:block!important;padding:0!important;max-width:none!important}
  .viewer{padding:0;max-width:none}
  .app .preview{display:block!important;position:static!important;max-height:none!important}
  .sheet{--sheet:#fff;--ink:#18203A;--ink-2:#4F5979;--rule:#D3D9E6;--cobalt:#2448C9;--marker:#FFE066;--marker-ink:#18203A;--soft:#E4E9F6;
    background:#fff!important;color:#18203A!important;border:0!important;box-shadow:none!important;padding:0!important;overflow:visible!important;max-height:none!important;
    font-size:8.2pt;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet h1{font-size:15pt;margin:0 0 4px}
  .sheet blockquote{padding:5px 9px;margin:0 0 4px}
  .sheet .sh-head p{margin:2px 0}
  .sheet .sh-body{column-count:3;column-gap:5mm;margin-top:6px}
  .sheet h2{margin:8px 0 3px;font-size:7.4pt;break-after:avoid}
  .sheet p{margin:2px 0}
  .sheet ul,.sheet ol{margin:2px 0;padding-left:1.15em}
  .sheet .sh-body > h2:first-child{margin-top:0}
  .sheet h3{font-size:8.6pt;margin:5px 0 1px;break-after:avoid}
  .sheet p,.sheet li,.sheet blockquote,.mood{break-inside:avoid}
  .sheet .appendix{break-before:page;border-top:0;margin-top:0}
  .sheet a{color:inherit;text-decoration:none}
}

@media (max-width:1080px){
  .viewtoggle{display:flex}
  .app{grid-template-columns:minmax(0,1fr)}
  .steps{position:static;overflow-x:auto;margin:0 -16px;padding:0 16px}
  .steps ol{flex-direction:row;gap:4px;width:max-content}
  .steps button{grid-template-columns:auto auto;padding:6px 10px;background:var(--sheet);border:1px solid var(--rule)}
  .steps button[aria-current="step"]{box-shadow:inset 0 -3px 0 var(--cobalt)}

<script>

/* ジャンル別の問い：st はそれを表示するステップのID */
const GQ={
 roguelite:[
  {id:'rl_run',st:'concept',q:'1回のラン（周回）は、どこから始まり、何が起きたら終わりますか？',ph:'例：港を出て潜り始め、浮上するか倒れたら終わり'},
  {id:'rl_death',st:'experience',q:'倒れたとき、プレイヤーには何を感じてほしいですか？（悔しさ・「次はこうする」・笑い など）',ph:'例：「欲張りすぎた」と自分の判断を振り返れる悔しさ'},
  {id:'rl_vary',st:'loop',q:'ランごとに毎回変わるもの（地形・報酬・敵・ビルド）は何ですか？',ph:'例：層の地形、遺物の位置、出てくる生物の組み合わせ'},
  {id:'rl_meta',st:'loop',q:'周回をまたいで残るもの（メタ成長・解放・知識）は何ですか？',ph:'例：持ち帰った宝での装備改良、生物図鑑'},
  {id:'rl_build',st:'systems',q:'ビルド（強化の組み合わせ）は、何と何の掛け算で生まれますか？',ph:'例：ランタンの種類 × 潜水服の特性'},
  {id:'rl_luck',st:'systems',q:'運と実力の比率はどのくらいですか？運が悪いときの救済は？',ph:'例：地形と遺物の位置は運、灯りの使い方は実力。7:3で実力寄り'},
  {id:'rl_min',st:'scope',q:'最初の版に必要な最小の中身（敵・アイテム・層の数）は？',ph:'例：3層、敵5種、遺物10個'}],
 puzzle:[
  {id:'pz_rule',st:'concept',q:'プレイヤーが発見する中心のルールは何ですか？（言葉で教えずに気づかせたいこと）',ph:'例：影の中にあるものだけが動かせる'},
  {id:'pz_aha',st:'experience',q:'「ひらめき」の瞬間は、どんな気づきから生まれますか？',ph:'例：自分の影も道具として使えると気づいたとき'},
  {id:'pz_teach',st:'loop',q:'新しいルールをどの順で教えますか？（導入 → 応用 → ひねり）',ph:'例：1面で影の存在、3面で影を伸ばす、5面で自分の影'},

  {id:'pz_combine',st:'systems',q:'ルール同士の組み合わせで、新しい問題をどう作りますか？',ph:'例：光源の数 × 動かせる物の重さ'},
  {id:'pz_count',st:'scope',q:'最初の版で作る問題数と、ルールの数は？',ph:'例：ルール3つ、問題20問'}],

  {id:'adv_emotion',st:'experience',q:'感情を動かすのは、物語の展開ですか、プレイヤー自身の行動ですか？',ph:'例：自分で証拠を突きつけた瞬間に感情が動くようにしたい'},

  fields:[

   {k:'audience',type:'textarea',label:'誰に遊んでほしいか',ph:'例：仕事終わりに短く遊びたいローグライト経験者',hint:'年齢よりも「どんな遊び方をする人か」「何が好きな人か」で書くと、設計の判断に使えます。'},

/* ---------- storage ---------- */
const KEY='game-concept-note-v1';
let store={current:null,docs:{},exp:{mood:false,tests:false}};
const ITEM_KEYS={mood:['kind','url','src','title','note'],playtests:['date','build','question','status','result','reaction','change']};
/* 読み込んだデータを今の形にそろえる（古い保存データ・バックアップ・共有リンクで共通） */
function normalize(d){const base=blank();if(!d||typeof d!=='object'||Array.isArray(d))return base;
 const FD=Object.fromEntries(SECTIONS.flatMap(x=>x.fields||[]).map(f=>[f.k,f]));
 for(const k of Object.keys(base)){const v=d[k],b=base[k];if(v==null)continue;
  if(Array.isArray(b)){if(!Array.isArray(v))continue;const f=FD[k];
   const keys=ITEM_KEYS[k]||(f&&f.type==='cards'?f.sub.map(x=>x.k):null);
   base[k]=keys?v.filter(o=>o&&typeof o==='object'&&!Array.isArray(o)).map(o=>Object.fromEntries(keys.map(x=>[x,typeof o[x]==='string'?o[x]:'']))):v.filter(x=>typeof x==='string');}
  else if(typeof b==='object'){if(typeof v==='object'&&!Array.isArray(v))base[k]=Object.fromEntries(Object.entries(v).filter(([,x])=>typeof x==='string'));}
  else if(typeof v==='string')base[k]=v;}
 base.mood=base.mood.filter(m=>MOOD_L[m.kind]);
 return base;}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.docs&&typeof s.docs==='object'&&Object.keys(s.docs).length)store=s;}}catch(e){}
 for(const id of Object.keys(store.docs)){const d=store.docs[id];if(!d||typeof d!=='object'){delete store.docs[id];continue;}
  d.data=normalize(d.data);if(typeof d.updated!=='number')d.updated=Date.now();
  ['variant','verdict','reason','parent'].forEach(k=>{if(typeof d[k]!=='string')d[k]='';});}
 store.exp=Object.assign({mood:false,tests:false},store.exp&&typeof store.exp==='object'?store.exp:{});
 if(!store.current||!store.docs[store.current]){const ids=Object.keys(store.docs);
  if(ids.length)store.current=ids.sort((a,b)=>store.docs[b].updated-store.docs[a].updated)[0];
  else{const id=newId();store.docs[id]=mkDoc(sample(),{sample:true});store.current=id;}}}
function mkDoc(data,extra){return Object.assign({data,updated:Date.now(),variant:'',verdict:'',reason:'',parent:''},extra||{});}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(store));return true;}catch(e){toast('保存できませんでした。ブラウザーの保存容量がいっぱいの可能性があります。取り込んだ画像を減らしてください。');return false;}}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250);}
function newId(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function doc(){return store.docs[store.current];}
function S(){return doc().data;}
const byUpdated=(a,b)=>store.docs[b].updated-store.docs[a].updated;
function sortedIds(){return Object.keys(store.docs).sort(byUpdated);}
function docLabel(id){const d=store.docs[id];const v=(VERDICTS.find(x=>x.k===d.verdict)||{}).l;
 return `${t(d.data.title)||'無題の企画'}${t(d.variant)?' ／ '+t(d.variant):''}${v?` ［${v}］`:''}`;}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=v=>String(v??'').trim();
const nn=a=>(a||[]).filter(x=>t(x)).length;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let step=0;

function filled(f,s){const v=s[f.k];
 if(f.type==='list'||f.type==='ranked')return nn(v)>0;
 if(f.type==='chips')return f.single?!!t(v):(v||[]).length>0;
 if(f.type==='cards')return (v||[]).some(o=>t(o[f.primary]));
 if(f.type==='mood'||f.type==='playtests')return (v||[]).length>0;
 return !!t(v);}
function secProgress(sec,s){const fs=(sec.fields||[]).filter(f=>!f.opt);if(!fs.length)return null;return [fs.filter(f=>filled(f,s)).length,fs.length];}

/* ---------- render: nav ---------- */
function renderNav(){const s=S();let tot=0,fil=0;
 $('#stepList').innerHTML=SECTIONS.map((sec,i)=>{const p=secProgress(sec,s);let ptxt='';
  if(p){tot+=p[1];fil+=p[0];ptxt=`<span class="p${p[0]===p[1]?' full':''}">${p[0]}/${p[1]}</span>`;}
  else if(sec.id==='tests'&&s.playtests.length)ptxt=`<span class="p">${s.playtests.length}件</span>`;
  return `<li><button type="button" data-step="${i}"${i===step?' aria-current="step"':''}><span class="n">${String(i+1).padStart(2,'0')}</span><span>${sec.title}</span>${ptxt}</button></li>`;}).join('');
 const pct=tot?Math.round(fil/tot*100):0;
 $('#overallTxt').textContent=`記入率 ${pct}%`;$('#overallBar').style.width=pct+'%';$('#pvPct').textContent=`記入率 ${pct}%`;}

function hintH(f){return f.hint?`<p class="hint">${esc(f.hint)}</p>`:'';}
function fieldH(f,s){const v=s[f.k];
 if(f.type==='text')return `<div class="field"><label class="label" for="f-${f.k}">${f.label}</label>${hintH(f)}<input type="text" id="f-${f.k}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph)}"></div>`;
 if(f.type==='textarea')return `<div class="field"><label class="label" for="f-${f.k}">${f.label}</label>${hintH(f)}<textarea id="f-${f.k}" data-k="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph)}">${esc(v)}</textarea></div>`;
 if(f.type==='chips'){const sel=f.single?[v]:(v||[]);
  return `<div class="field"><span class="label">${f.label}</span>${hintH(f)}<div class="chips${f.rich?' rich':''}">${f.options.map(o=>`<button type="button" class="chip" data-act="chip" data-k="${f.k}" data-v="${esc(o.k)}" aria-pressed="${sel.includes(o.k)}">${esc(o.l)}${o.d?`<small>${esc(o.d)}</small>`:''}</button>`).join('')}</div>${f.sug?'<p class="gsug" id="gsug" hidden></p>':''}</div>`;}
 if(f.type==='list'||f.type==='ranked'){const rk=f.type==='ranked';
  const rows=v.map((x,i)=>`<div class="row"><span class="idx">${(rk||f.viz)?i+1:'・'}</span><input type="text" id="f-${f.k}-${i}" data-k="${f.k}" data-i="${i}" value="${esc(x)}" placeholder="${esc(phOf(f,i))}" aria-label="${esc(f.label)} ${i+1}">${rk?`<button type="button" class="icon" data-act="up" data-k="${f.k}" data-i="${i}" aria-label="上へ"${i===0?' disabled':''}>↑</button><button type="button" class="icon" data-act="down" data-k="${f.k}" data-i="${i}" aria-label="下へ"${i===v.length-1?' disabled':''}>↓</button>`:''}<button type="button" class="icon" data-act="del" data-k="${f.k}" data-i="${i}" aria-label="削除">×</button></div>`).join('');
  return `<div class="field"><span class="label">${f.label}</span>${hintH(f)}<div class="rows">${rows}</div><button type="button" class="add" data-act="add" data-k="${f.k}">＋ 行を追加</button>${f.viz?`<div class="loopviz" id="loopviz"></div>`:''}</div>`;}
 if(f.type==='cards'){
  const cards=v.map((o,i)=>`<div class="card"><div class="card-head"><span>${f.numbered?'PILLAR '+(i+1):'#'+(i+1)}</span><button type="button" class="icon" data-act="del" data-k="${f.k}" data-i="${i}" aria-label="削除">×</button></div>${f.sub.map(sf=>{const id=`f-${f.k}-${i}-${sf.k}`;const ctl=sf.area?`<textarea id="${id}" rows="2" data-k="${f.k}" data-i="${i}" data-sub="${sf.k}" placeholder="${esc(sf.ph)}">${esc(o[sf.k])}</textarea>`:`<input type="text" id="${id}" data-k="${f.k}" data-i="${i}" data-sub="${sf.k}" value="${esc(o[sf.k])}" placeholder="${esc(sf.ph)}">`;return `<label class="${sf.full?'full':''}" for="${id}">${esc(sf.l)}${ctl}</label>`;}).join('')}</div>`).join('');
  return `<div class="field"><span class="label">${f.label}</span>${hintH(f)}<div class="cards">${cards}</div><button type="button" class="add" data-act="add" data-k="${f.k}">＋ 追加</button></div>`;}
 if(f.type==='mood')return moodFieldH(f,s);

/* mood board */
function safeUrl(u){u=t(u);if(!/^https?:\/\/\S+$/i.test(u))return '';try{new URL(u);return u;}catch(e){return '';}}
function moodKind(u){if(/\.(png|jpe?g|gif|webp|avif|svg)(?:[?#]|$)/i.test(u))return 'image';if(/(?:youtube\.com|youtu\.be|soundcloud\.com|spotify\.com|bandcamp\.com|music\.apple\.com|nicovideo\.jp)/i.test(u))return 'music';return 'link';}
function moodThumb(m){const src=m.kind==='local'?(/^data:image\/(png|jpe?g|gif|webp);base64,/.test(m.src)?m.src:''):(m.kind==='image'?safeUrl(m.url):'');
 if(src)return `<img src="${esc(src)}" alt="${esc(t(m.title)||MOOD_L[m.kind])}" loading="lazy" referrerpolicy="no-referrer" data-fallback>`;

  <input type="text" data-k="mood" data-i="${i}" data-sub="title" value="${esc(m.title)}" placeholder="名前（例：発光生物の写真）" aria-label="資料の名前">
  <textarea rows="2" data-k="mood" data-i="${i}" data-sub="note" placeholder="何を参考にしたいか（例：青黒の中に点で光る色づかい）" aria-label="何を参考にしたいか">${esc(m.note)}</textarea></div></div>`;}).join('');
 return `<div class="field"><span class="label">${f.label}</span>${hintH(f)}
  <div class="mood-add"><input type="url" id="moodUrl" placeholder="画像・音楽・動画・ページのURL（https://…）" aria-label="参考資料のURL"><button type="button" class="btn" data-act="moodurl">URLを追加</button><button type="button" class="btn" data-act="moodfile">画像を取り込む</button><input type="file" id="moodFile" accept="image/*" multiple hidden></div>
  <p class="hint">取り込んだ画像は縮小して、このブラウザーの中にだけ保存されます（共有リンクには含まれません）。</p>
  ${items?`<div class="mood-grid">${items}</div>`:''}</div>`;}
function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;
 im.onload=()=>{const M=480,r=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
  let q=.72,u=c.toDataURL('image/jpeg',q);while(u.length>60000&&q>.3){q-=.12;u=c.toDataURL('image/jpeg',q);}res(u);};im.src=fr.result;};fr.readAsDataURL(file);});}

/* ---------- checks (記入漏れ) ---------- */
function checks(s){const o=[];const L=(lv,tx,st)=>o.push({lv,tx,st:stepOf(st)});
 const c=t(s.concept);
 if(!c)L('warn','一言コンセプトがまだ空です。プレイヤーが何をするゲームかを1〜2文で書きましょう。','concept');
 else if(c.length>90)L('tip',`一言コンセプトが${c.length}文字あります。60文字前後まで削ると、人に伝わりやすくなります。`,'concept');
 if(!t(s.hook))L('warn','フックが空です。似た作品と並んだとき、このゲームを選ぶ理由を一つ書きましょう。','concept');
 if(!t(s.audience))L('tip','誰に遊んでほしいかが空です。難易度や1回の長さを決める手がかりになります。','basics');
 if(!nn(s.feelings))L('warn','プレイヤーに感じてほしいことが空です。企画の出発点になる項目です。','experience');
 if(!s.funs.length)L('tip','中心になる楽しさの種類が未選択です。','experience');
 else if(s.funs.length>3)L('tip',`楽しさの種類が${s.funs.length}つ選ばれています。主役を3つまでに絞ると判断がぶれにくくなります。`,'experience');
 if(!t(s.moment))L('tip','忘れられない瞬間が空です。遊んだ人が誰かに話したくなる場面を1つ。','experience');
 const pn=s.pillars.filter(p=>t(p.name)).length;
 if(pn<3)L('warn',`デザインピラーが${pn}つです。3〜4つあると、アイデアを選ぶ基準として働きます。`,'pillars');
 else if(pn>5)L('tip',`デザインピラーが${pn}つあります。多すぎると基準として使いにくくなります。`,'pillars');
 const pNo=s.pillars.filter(p=>t(p.name)&&!t(p.no)).length;
 if(pNo)L('tip',`${pNo}つのピラーに「反するアイデア」がありません。何を断るかが書いてあると、判定に使えます。`,'pillars');
 const ln=nn(s.loop);
 if(ln<3)L('warn',`コアループが${ln}ステップです。3〜5ステップで、最後が最初につながる形にしましょう。`,'loop');
 else if(ln>7)L('tip',`コアループが${ln}ステップあります。核になる部分だけに絞れないか見直しましょう。`,'loop');
 if(!nn(s.verbs))L('tip','プレイヤーができること（動詞）が空です。','loop');
 if(!t(s.winLose))L('tip','成功・失敗の条件が空です。','systems');
 if(!nn(s.notNow))L('warn','「今回は入れないもの」が空です。1つ決めておくと、作業が膨らむのを防げます。','scope');
 if(!t(s.question))L('warn','プロトタイプで確かめたいことが空です。最初に作るものの目的になります。','next');
 if(!nn(s.next))L('tip','次に作るものが空です。','next');
 return o;}

/* ---------- review (矛盾・スコープの見直し：ルール式) ---------- */
const Z2H=x=>String(x??'').replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
function durMin(str){const x=Z2H(str);let max=0,m;const re=/(\d+(?:\.\d+)?)\s*(?:[〜~～\-－]\s*(\d+(?:\.\d+)?))?\s*(時間半|時間|hours?|hr|h|分|min)/gi;
 while((m=re.exec(x))){const n=parseFloat(m[2]||m[1]);const u=m[3].toLowerCase();const v=u==='時間半'?n*60+30:(u==='分'||u==='min')?n:n*60;if(v>max)max=v;}
 return max||null;}
const TOTAL_RE=/クリア|全体|ボリューム|エンディング|合計|総|トータル|全部|やり込み|全\d/;
function playParts(str){let ses=null,tot=null;
 for(const p of Z2H(str).split(/[、,，\/／;；\n]/)){const d=durMin(p);if(d==null)continue;if(TOTAL_RE.test(p)){if(tot==null)tot=d;}else if(ses==null)ses=d;}
 return {ses,tot};}
function teamN(str){const x=Z2H(str);if(!t(x))return null;const m=x.match(/(\d+)\s*(?:人|名)/);if(m)return +m[1];
 if(/ソロ|一人|ひとり|個人/.test(x))return 1;if(/二人|ふたり/.test(x))return 2;const n=x.match(/\d+/);return n?+n[0]:null;}
function months(str){const x=Z2H(str);if(!t(x))return null;if(/半年/.test(x))return 6;let max=0,m;
 const re=/(\d+(?:\.\d+)?)\s*(?:[〜~～\-－]\s*(\d+(?:\.\d+)?))?\s*(年|か月|ヶ月|ケ月|カ月|ヵ月|箇月|月|週間|週|日)/g;
 while((m=re.exec(x))){const n=parseFloat(m[2]||m[1]);const u=m[3];const v=u==='年'?n*12:/週/.test(u)?n/4.3:u==='日'?n/30:n;if(v>max)max=v;}
 return max||null;}
const fmtMo=mo=>mo<1?`${Math.max(1,Math.round(mo*4.3))}週間`:`${Math.round(mo*10)/10}か月`;
const STOP=new Set(['体験','連続','要素','プレイ','ゲーム','プレイヤー','ゲー','感じ','状態','場合','自分']);
function tokens(str,min=1){return (String(str||'').match(/[一-鿿々]+|[゠-ヿ]{2,}/g)||[]).filter(w=>w.length>=min&&!STOP.has(w));}
function hay(s){return [s.loop.join(' '),s.loopSession,s.verbs.join(' '),s.systems.map(x=>x.name+' '+x.content).join(' '),s.winLose].join(' ');}
const sysN=s=>s.systems.filter(x=>t(x.content)).length;
const SHORT_RE=/短時間|短い時間|短く|サクッと|さくっと|スキマ|隙間|すき間|通勤|手軽|ちょっとした時間/;
const RULES=[
 {id:'short-long',st:'basics',f:s=>{const {ses}=playParts(s.playtime);if(ses>30&&SHORT_RE.test([s.audience,s.concept,s.fantasy,s.rules.join(' ')].join(' ')))
   return `短い時間で遊べることを狙っていますが、1回のプレイが約${ses}分あります。途中で区切れる場所を作るか、1回を短くできますか？`;}},
 {id:'rule-limit',st:'scope',f:s=>{const {ses}=playParts(s.playtime);if(!ses)return;
   for(const r of s.rules){const m=Z2H(r).match(/(\d+)\s*分(?:を|は)?(?:超え|越え|以内|まで|未満)/);if(m&&ses>+m[1])return `方針「${t(r)}」に対して、1回のプレイ時間が約${ses}分になっています。どちらに合わせますか？`;}}},
 {id:'scope-load',st:'systems',f:s=>{const n=teamN(s.team),mo=months(s.period),sy=sysN(s),vb=nn(s.verbs),load=sy+Math.ceil(vb/2);
   if(n&&mo){if(load>=4&&load>n*mo*1.5)return `制作${n}人・約${fmtMo(mo)}に対して、主要システムが${sy}つ${vb?`、動詞が${vb}つ`:''}あります。最初の版で作り切れますか？後回しにできるものはどれですか？`;}
   else if(n===1&&sy>=5)return `1人で制作する予定に対して、主要システムが${sy}つあります。最初の版に本当に必要なのはどれですか？`;}},
 {id:'volume',st:'basics',f:s=>{const n=teamN(s.team),mo=months(s.period),{tot}=playParts(s.playtime);
   if(tot&&tot>=20*60&&n&&n<=2&&(!mo||mo<12))return `全体のボリュームが約${Math.round(tot/60)}時間ありますが、制作は${n}人${mo?'・約'+fmtMo(mo):''}です。その長さを支える中身（ステージ・敵・シナリオ）の量を見積もれていますか？`;}},
 {id:'story-cut',st:'scope',f:s=>{if(!s.funs.includes('narrative'))return;const x=s.notNow.find(v=>/ストーリー|物語|シナリオ|会話|テキスト/.test(v));
   if(x)return `「物語」を中心の楽しさに選んでいますが、「今回は入れないもの」に「${t(x)}」があります。物語の楽しさを何で届けますか？`;}},
 {id:'multi-cut',st:'scope',f:s=>{if(!s.funs.includes('fellowship'))return;const x=s.notNow.find(v=>/マルチ|オンライン|協力|対戦|通信|多人数/.test(v));
   if(x)return `「仲間」を中心の楽しさに選んでいますが、「今回は入れないもの」に「${t(x)}」があります。仲間の楽しさをどこで作りますか？`;}},
 {id:'hook-fun',st:'concept',f:s=>{const k={'物語':'narrative','見た目・音':'sensation'}[s.hookType];
   if(k&&!s.funs.includes(k))return `フックの種類は「${s.hookType}」ですが、中心になる楽しさに「${FUNS.find(f=>f.k===k).l}」が入っていません。フックと楽しさは同じ方向を向いていますか？`;}},
 {id:'device',st:'loop',f:s=>{if(!/スマホ|スマートフォン|iOS|iPhone|Android|モバイル/i.test(s.platform))return;const m=String(s.control).match(/スティック|トリガー|キーボード|マウス|十字キー/);
   if(m)return `プラットフォームにスマホが含まれていますが、操作に「${m[0]}」があります。タッチ操作ではどう遊びますか？`;}},
 {id:'anti-in',st:'experience',f:s=>{const h=hay(s);for(const a of s.anti)for(const w of tokens(a,2))if(h.includes(w))
   return `「作りたくない体験」に「${t(a)}」がありますが、ループやシステムにも「${w}」が出てきます。避けたい体験を自分で入れていませんか？`;}},
 {id:'pillar-loop',st:'pillars',f:s=>{const h=hay(s);if(!t(h))return;
   const miss=s.pillars.filter(p=>{const tk=tokens(p.name);return tk.length&&!tk.some(w=>h.includes(w));}).map(p=>`「${t(p.name)}」`);
   if(miss.length)return `ピラー${miss.join('')}の言葉が、コアループ・システム・動詞のどこにも出てきません。その柱はプレイのどこで効きますか？`;}},
 {id:'idea-pile',st:'scope',f:s=>{if(nn(s.ideas)>=nn(s.notNow)+3&&sysN(s)>=4)return `アイデア置き場が${nn(s.ideas)}件あり、「今回は入れないもの」より大幅に多くなっています。置き場から本編に入り込んでいるものはありませんか？`;}},
 {id:'untested',st:'tests',f:s=>{if(t(s.question)&&nn(s.next)&&!s.playtests.length)return 'プロトタイプで確かめたいことは決まっていますが、検証日誌にまだ記録がありません。試作を遊んでもらったら、結果を残しましょう。';}},
 {id:'test-no',st:'tests',f:s=>{const p=s.playtests[0];if(p&&p.status==='no')return `最新の検証（${t(p.date)||'日付なし'}）では問いを確認できませんでした。試作品を変えますか？それとも、コンセプトやピラーを見直しますか？`;}},
 {id:'test-nochange',st:'tests',f:s=>{const p=s.playtests[0];if(p&&(t(p.result)||t(p.reaction))&&!t(p.change))return '最新の検証に「次に変えること」がありません。結果から1つ選んで、次の試作で変えましょう。';}},
 {id:'mood-note',st:'world',f:s=>{const n=s.mood.filter(m=>!t(m.note)).length;if(n)return `ムードボードに「何を参考にしたいか」が書かれていない資料が${n}件あります。意図を添えると、見た目だけでなく狙いが伝わります。`;}}];
function review(s,all){const o=[];for(const r of RULES){if(!all&&s.dismissed.includes(r.id))continue;let tx;try{tx=r.f(s);}catch(e){}if(tx)o.push({id:r.id,tx,st:stepOf(r.st)});}return o;}

/* ---------- markdown ---------- */
function toMD(s,meta){const out=[];const P=x=>out.push(x);const B=()=>out.push('');meta=meta||{};
 const list=(a,pre='- ')=>a.filter(x=>t(x)).forEach((x,i)=>P((pre==='1'?`${i+1}. `:pre)+t(x)));

function inl(x){return esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function mdHTML(md){const L=md.split('\n');let h='',lt=null,para=[];
 const fl=()=>{if(para.length){h+=`<p>${para.join('<br>')}</p>`;para=[];}};
 const cl=()=>{if(lt){h+=`</${lt}>`;lt=null;}};
 for(const ln of L){let m;
  if(!ln.trim()){fl();cl();continue;}
  if(m=ln.match(/^(#{1,3}) (.*)/)){fl();cl();const n=m[1].length;h+=`<h${n}>${inl(m[2])}</h${n}>`;continue;}
  if(m=ln.match(/^> (.*)/)){fl();cl();h+=`<blockquote>${inl(m[1])}</blockquote>`;continue;}
  if(m=ln.match(/^- (.*)/)){fl();if(lt!=='ul'){cl();h+='<ul>';lt='ul';}h+=`<li>${inl(m[1])}</li>`;continue;}
  if(m=ln.match(/^\d+\. (.*)/)){fl();if(lt!=='ol'){cl();h+='<ol>';lt='ol';}h+=`<li>${inl(m[1])}</li>`;continue;}
  cl();para.push(inl(ln));}
 fl();cl();return h;}

const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
 dec:str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}};
async function pipe(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());}
async function pwKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encrypt(u8,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await pwKey(pw,salt),u8));const o=new Uint8Array(28+c.length);o.set(salt);o.set(iv,16);o.set(c,28);return o;}
async function decrypt(u8,pw){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(16,28)},await pwKey(pw,u8.slice(0,16)),u8.slice(28)));}
/* 形式：#v1.<flags>.<base64url>　flags: z=deflate圧縮 / r=非圧縮、末尾 e=パスワード暗号化 */
async function makeShare(opt){const d=normalize(JSON.parse(JSON.stringify(S())));
 if(!opt.scope){d.ideas=[];d.open=[];}
 if(!opt.tests)d.playtests=[];
 d.mood=opt.mood?d.mood.map(m=>m.kind==='local'?Object.assign({},m,{src:''}):m):[];
 d.dismissed=[];
 const m=doc();const payload={d,m:{variant:m.variant||'',verdict:m.verdict||'',reason:m.reason||''},x:{mood:d.mood.length>0,tests:d.playtests.length>0}};
 let bytes=new TextEncoder().encode(JSON.stringify(payload)),fl='r';
 if(window.CompressionStream){bytes=await pipe(bytes,new CompressionStream('deflate-raw'));fl='z';}
 if(opt.pw){bytes=await encrypt(bytes,opt.pw);fl+='e';}
 return {url:`${location.href.split('#')[0]}#v1.${fl}.${b64u.enc(bytes)}`,zipped:fl[0]==='z'};}
async function readShare(hash,pw){const m=hash.match(/^#v1\.([a-z]+)\.([A-Za-z0-9_-]+)$/);if(!m)throw new Error('format');
 let bytes=b64u.dec(m[2]);if(m[1].includes('e'))bytes=await decrypt(bytes,pw||'');
 if(m[1][0]==='z'){if(!window.DecompressionStream)throw new Error('nozip');bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));}
 const p=JSON.parse(new TextDecoder().decode(bytes));if(!p||typeof p!=='object')throw new Error('payload');return p;}
function shareWarn(len,zipped,pw){const w=[];

 else if(len>2000)w.push('リンクが2,000文字を超えています。SNSや一部のチャットでは途中で切れることがあります。');
 if(pw)w.push('パスワードは、リンクとは別の手段で伝えてください。');

 for(const f of fs){try{const src=await shrinkImage(f);S().mood.push({kind:'local',url:'',src,title:f.name.replace(/\.[^.]+$/,''),note:''});n++;}catch(err){}}
 if(n){renderForm();touch();toast(`${n}枚の画像を取り込みました`);}else toast('画像を読み込めませんでした');});

const blankItem=k=>{const f=SECTIONS.flatMap(x=>x.fields||[]).find(x=>x.k===k);if(f.type==='cards'){const o={};f.sub.forEach(sf=>o[sf.k]='');return o;}return '';};
$('#form').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.step!==undefined){go(+b.dataset.step);return;}
 const a=b.dataset.act;if(!a)return;const s=S(),k=b.dataset.k,i=+b.dataset.i;
 if(a==='next'){go(step+1);return;} if(a==='prev'){go(step-1);return;}
 if(a==='mode'){outMode=b.dataset.v;document.querySelectorAll('[data-act="mode"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===outMode));updateOut();return;}
 if(a==='copy'){copyText(outText(),$('#out'));return;}
 if(a==='import'){const raw=$('#impText').value;try{const d=JSON.parse(raw);if(!d||typeof d!=='object'||Array.isArray(d))throw 0;
   const id=newId();store.docs[id]=mkDoc(normalize(d));store.current=id;save();refreshDocSel();go(0);renderPreview();toast('読み込みました');}
  catch(err){toast('読み込めませんでした。「バックアップ（JSON）」でコピーした内容をそのまま貼り付けてください。');}return;}
 if(a==='chip'){const f=SECTIONS[step].fields.find(x=>x.k===k);const v=b.dataset.v;
  if(f.single){s[k]=s[k]===v?'':v;}else{s[k]=s[k].includes(v)?s[k].filter(x=>x!==v):[...s[k],v];}
  if(f.single)b.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===s[k]));
  else b.setAttribute('aria-pressed',s[k].includes(v));
  if(k==='genreTpl')updateGenreSug();
  touch();return;}
 if(a==='usegenre'){s.genreTpl=b.dataset.v;renderForm();touch();toast(`「${genreL(s.genreTpl)}」の問いを各ステップに追加しました`);return;}
 if(a==='add'){s[k].push(blankItem(k));renderForm();touch();const n=s[k].length-1;const f=$(`[data-k="${k}"][data-i="${n}"]`);if(f)f.focus();return;}
 if(a==='del'){s[k].splice(i,1);renderForm();touch();return;}
 if(a==='up'&&i>0){[s[k][i-1],s[k][i]]=[s[k][i],s[k][i-1]];renderForm();touch();$(`[data-act="up"][data-k="${k}"][data-i="${i-1}"]`)?.focus();return;}
 if(a==='down'&&i<s[k].length-1){[s[k][i+1],s[k][i]]=[s[k][i],s[k][i+1]];renderForm();touch();$(`[data-act="down"][data-k="${k}"][data-i="${i+1}"]`)?.focus();return;}
 if(a==='moodurl'){const inp=$('#moodUrl');const u=safeUrl(inp.value);if(!u){toast('https:// から始まるURLを入れてください');inp.focus();return;}
  s.mood.push({kind:moodKind(u),url:u,src:'',title:'',note:''});renderForm();touch();$(`[data-k="mood"][data-i="${s.mood.length-1}"][data-sub="note"]`)?.focus();return;}
 if(a==='moodfile'){$('#moodFile').click();return;}
 if(a==='addtest'){s.playtests.unshift({date:today(),build:'',question:t(s.question),status:'',result:'',reaction:'',change:''});renderForm();touch();$('#pt-0-build')?.focus();return;}
 if(a==='ptst'){const p=s.playtests[i];p.status=p.status===b.dataset.v?'':b.dataset.v;b.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===p.status));touch();return;}
 if(a==='send'){const lines=String(s.playtests[i].change||'').split('\n').map(t).filter(Boolean);if(!lines.length){toast('「次に変えること」が空です');return;}
  const to=b.dataset.to,arr=s[to];while(arr.length&&!t(arr[arr.length-1]))arr.pop();let n=0;lines.forEach(l=>{if(!arr.map(t).includes(l)){arr.push(l);n++;}});if(!arr.length)arr.push('');
  touch();toast(n?`${n}件を「${to==='next'?'次に作るもの':'未決定事項'}」に追加しました`:'すでに追加済みです');return;}
 if(a==='dismiss'){if(!s.dismissed.includes(b.dataset.v))s.dismissed.push(b.dataset.v);renderForm();touch();return;}
 if(a==='undismiss'){s.dismissed=[];renderForm();touch();return;}
 if(a==='copyshare'){copyText($('#shUrl').value,$('#shUrl'));return;}
 if(a==='mkshare'){const pw=$('#shPass').value;if(pw&&!(window.crypto&&crypto.subtle)){toast('この環境ではパスワードを付けられません（https で開いてください）');return;}
  b.disabled=true;makeShare({scope:$('#shScope').checked,mood:$('#shMood').checked,tests:$('#shTests').checked,pw})
   .then(r=>{$('#shOut').hidden=false;$('#shUrl').value=r.url;$('#shLen').textContent=`${r.url.length.toLocaleString()}文字`;$('#shWarn').innerHTML=shareWarn(r.url.length,r.zipped,!!pw);$('#shUrl').select();})
   .catch(()=>toast('リンクを作れませんでした')).finally(()=>{b.disabled=false;});return;}
});
document.addEventListener('change',e=>{const el=e.target;if(!el.classList||!el.classList.contains('exopt'))return;store.exp[el.dataset.ex]=el.checked;syncExopt();save();renderPreview();updateOut();});
document.addEventListener('click',e=>{if(e.target.closest('[data-print]'))doPrint();});
document.addEventListener('error',e=>{const im=e.target;if(im&&im.tagName==='IMG'&&im.hasAttribute('data-fallback')){const sp=document.createElement('span');sp.textContent='画像を読み込めませんでした';im.replaceWith(sp);}},true);
$('#stepList').addEventListener('click',e=>{const b=e.target.closest('button[data-step]');if(b)go(+b.dataset.step);});
function go(n){closeCompare();step=Math.max(0,Math.min(SECTIONS.length-1,n));renderNav();renderForm();setView('form');
 const f=$('#form');const r=f.getBoundingClientRect();if(r.top<0)f.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
 const cur=$('#stepList [aria-current="step"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'nearest'});}

/* view toggle (narrow screens) */
function setView(v){$('#app').classList.toggle('show-preview',v==='prev');$('#vForm').setAttribute('aria-pressed',v!=='prev');$('#vPrev').setAttribute('aria-pressed',v==='prev');}
$('#vForm').onclick=()=>setView('form');$('#vPrev').onclick=()=>setView('prev');

/* docs */
function refreshDocSel(){const sel=$('#docSel');
 sel.innerHTML=sortedIds().map(id=>`<option value="${id}"${id===store.current?' selected':''}>${esc(docLabel(id))}</option>`).join('');
 $('#banner').hidden=!doc().sample;}
function openDoc(id){store.current=id;save();disarm();refreshDocSel();go(0);renderPreviewNow();}
$('#docSel').onchange=e=>openDoc(e.target.value);
function newBlank(){const id=newId();store.docs[id]=mkDoc(blank());openDoc(id);toast('新しい企画を作りました');}
$('#newDoc').onclick=newBlank;
$('#startBlank').onclick=()=>{const old=store.current;delete store.docs[old];newBlank();};
let armed=false;function disarm(){armed=false;const b=$('#delDoc');b.textContent='この企画を削除';b.classList.remove('danger-armed');}
$('#delDoc').onclick=()=>{const b=$('#delDoc');
 if(!armed){armed=true;b.textContent='もう一度押すと削除';b.classList.add('danger-armed');setTimeout(()=>{if(armed)disarm();},4000);return;}
 disarm();delete store.docs[store.current];const ids=sortedIds();
 if(ids.length)store.current=ids[0];else{const id=newId();store.docs[id]=mkDoc(blank());store.current=id;}
 save();refreshDocSel();go(0);renderPreviewNow();toast('削除しました');};

/* 別案（複製） */
$('#dupDoc').onclick=()=>{const dl=$('#dupDlg');dl.returnValue='';$('#dupName').value='';$('#dupOrig').value=doc().variant||'';dl.showModal();$('#dupName').focus();};
$('#dupCancel').onclick=()=>$('#dupDlg').close('cancel');
$('#dupDlg').addEventListener('close',()=>{if($('#dupDlg').returnValue!=='ok')return;const cur=doc();cur.variant=t($('#dupOrig').value);
 const id=newId();store.docs[id]=mkDoc(normalize(JSON.parse(JSON.stringify(cur.data))),{parent:store.current,variant:t($('#dupName').value)||'別案'});
 openDoc(id);toast('別案を作りました。違いは「比較」で確かめられます');});

/* ---------- compare ---------- */
const CMP_ROWS=[
 {l:'一言コンセプト',v:s=>t(s.concept)},
 {l:'フック',v:s=>(t(s.hookType)?`【${t(s.hookType)}】`:'')+t(s.hook)},
 {l:'プレイヤーは何者か',v:s=>t(s.fantasy)},
 {l:'中心になる楽しさ',set:s=>s.funs.map(k=>(FUNS.find(f=>f.k===k)||{}).l).filter(Boolean)},
 {l:'デザインピラー',set:s=>s.pillars.filter(p=>t(p.name)).map(p=>t(p.name))},
 {l:'コアループ',seq:s=>s.loop.filter(x=>t(x)).map(t)},
 {l:'1回のプレイの流れ',v:s=>t(s.loopSession)},
 {l:'プレイ時間',v:s=>t(s.playtime)},
 {l:'プレイヤーができること',set:s=>s.verbs.filter(x=>t(x)).map(t)},
 {l:'主要システム',set:s=>s.systems.filter(x=>t(x.content)).map(x=>t(x.name)||t(x.content).slice(0,16))},
 {l:'今回は入れないもの',set:s=>s.notNow.filter(x=>t(x)).map(t)},
 {l:'確かめたい問い',v:s=>t(s.question)}];
let cmp={a:null,b:null};
function relatedOf(a){const d=store.docs[a];const ids=sortedIds().filter(x=>x!==a);
 return ids.find(x=>x===d.parent)||ids.find(x=>store.docs[x].parent===a)||ids.find(x=>d.parent&&store.docs[x].parent===d.parent)||ids[0]||null;}
function cmpCell(r,s,o){if(r.v){const x=r.v(s);return x?esc(x).replace(/\n/g,'<br>'):'<span class="none">（未記入）</span>';}
 const a=(r.set||r.seq)(s),b=(r.set||r.seq)(o);if(!a.length)return '<span class="none">（未記入）</span>';
 return `<div class="chipset">${a.map(x=>`<span class="ci${b.includes(x)?'':' only'}">${esc(x)}</span>`).join(r.seq?'<span class="ar">→</span>':'')}</div>`;}
function cmpDiff(r,a,b){if(r.v)return t(r.v(a))!==t(r.v(b));const f=r.set||r.seq;const x=f(a),y=f(b);return r.set?JSON.stringify([...x].sort())!==JSON.stringify([...y].sort()):JSON.stringify(x)!==JSON.stringify(y);}
function renderCompare(){if(!store.docs[cmp.a])cmp.a=store.current;if(!store.docs[cmp.b])cmp.b=relatedOf(cmp.a);
 const A=store.docs[cmp.a],B=store.docs[cmp.b],ids=sortedIds();
 const sel=sd=>`<select data-pick="${sd}" aria-label="比較する企画 ${sd.toUpperCase()}">${ids.map(id=>`<option value="${id}"${id===cmp[sd]?' selected':''}>${esc(docLabel(id))}</option>`).join('')}</select>`;
 let h=`<header class="sec-head"><p class="eyebrow">COMPARE</p><h2>案の比較</h2><p class="lead">2つの案のコンセプト・ピラー・コアループなどを並べます。違う行に印が付きます。どちらを採用するかと、その理由も残せます。</p></header>
 <p class="cmp-legend"><span class="dmark">違い</span>内容が異なる行　<span class="ci only">黄色</span>片方の案にだけある項目</p>
 <div class="cg"><div class="cg-row cg-top"><div class="cg-l"></div><div class="cg-c" data-side="A">${sel('a')}</div><div class="cg-c" data-side="B">${sel('b')}</div></div>`;
 if(cmp.a===cmp.b)h+=`<p class="notice">同じ企画が選ばれています。片方を別の案に変えてください。</p>`;
 for(const r of CMP_ROWS){const d=cmpDiff(r,A.data,B.data);
  h+=`<div class="cg-row${d?' diff':''}"><div class="cg-l">${esc(r.l)}${d?'<span class="dmark">違い</span>':''}</div><div class="cg-c" data-side="A">${cmpCell(r,A.data,B.data)}</div><div class="cg-c" data-side="B">${cmpCell(r,B.data,A.data)}</div></div>`;}
 h+=`<div class="cg-row cg-judge"><div class="cg-l">判定と理由</div>${['a','b'].map(sd=>{const id=cmp[sd],d=store.docs[id];
  return `<div class="cg-c" data-side="${sd.toUpperCase()}"><div class="seg" role="group" aria-label="判定">${VERDICTS.map(v=>`<button type="button" data-act="verdict" data-doc="${id}" data-v="${v.k}" aria-pressed="${d.verdict===v.k}">${v.l}</button>`).join('')}</div><textarea rows="3" data-reason="${id}" placeholder="この案を選んだ／選ばなかった理由" aria-label="理由">${esc(d.reason)}</textarea><button type="button" class="btn sm" data-act="editdoc" data-doc="${id}">この案を編集する</button></div>`;}).join('')}</div></div>`;
 $('#cmpIn').innerHTML=h;}
function openCompare(){if(Object.keys(store.docs).length<2){toast('比較するには企画が2つ以上必要です。「別案を作る」で複製しましょう。');return;}
 cmp.a=store.current;cmp.b=relatedOf(cmp.a);document.body.classList.add('comparing');$('#cmp').hidden=false;$('#cmpBtn').textContent='← 入力に戻る';renderCompare();window.scrollTo(0,0);}
function closeCompare(){if(!document.body.classList.contains('comparing'))return;document.body.classList.remove('comparing');$('#cmp').hidden=true;$('#cmpBtn').textContent='比較';}
$('#cmpBtn').onclick=()=>{if(document.body.classList.contains('comparing'))closeCompare();else openCompare();};
$('#cmp').addEventListener('change',e=>{const sd=e.target.dataset.pick;if(sd){cmp[sd]=e.target.value;renderCompare();}});
$('#cmp').addEventListener('input',e=>{const id=e.target.dataset.reason;if(id&&store.docs[id]){store.docs[id].reason=e.target.value;save();if(id===store.current)renderPreview();}});
$('#cmp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.doc;if(!store.docs[id])return;
 if(b.dataset.act==='verdict'){const d=store.docs[id];d.verdict=d.verdict===b.dataset.v?'':b.dataset.v;save();renderCompare();refreshDocSel();renderPreview();}
 if(b.dataset.act==='editdoc')openDoc(id);});

/* ---------- viewer (共有リンクを開いたとき) ---------- */
let viewing=null;
function startViewer(){document.body.classList.add('viewing');$('#viewer').hidden=false;const hash=location.hash;const enc=/^#v1\.[a-z]*e\./.test(hash);
 const show=async pw=>{try{const p=await readShare(hash,pw);const data=normalize(p.d);const pm=p.m&&typeof p.m==='object'?p.m:{};
   const meta={variant:String(pm.variant||''),verdict:String(pm.verdict||''),reason:String(pm.reason||'')};
   viewing={data,meta};$('#vSheet').innerHTML=sheetHTML(data,meta,{mood:!!(p.x&&p.x.mood),tests:!!(p.x&&p.x.tests)});
   $('#vPw').hidden=true;$('#vSheet').hidden=false;$('#vImport').hidden=false;document.title=`${t(data.title)||'無題の企画'} — ゲーム企画ノート`;}
  catch(e){if(enc){$('#vPwErr').hidden=false;$('#vPwIn').select();}
   else $('#vSheet').innerHTML=`<p class="empty-doc">${e&&e.message==='nozip'?'このブラウザーでは、圧縮されたリンクを開けません。新しいブラウザーで開いてください。':'このリンクは読み込めませんでした。リンクが途中で切れていないか確かめてください。'}</p>`;}};
 if(enc){$('#vPw').hidden=false;$('#vSheet').hidden=true;$('#vPwIn').focus();}else show();
 $('#vPw').onsubmit=e=>{e.preventDefault();$('#vPwErr').hidden=true;show($('#vPwIn').value);};
 $('#vImport').onclick=()=>{if(!viewing)return;const id=newId();store.docs[id]=mkDoc(viewing.data,{variant:viewing.meta.variant});store.current=id;
  if(saveNow())location.replace(location.href.split('#')[0]);};
 $('#vClose').onclick=()=>location.replace(location.href.split('#')[0]);}
window.addEventListener('hashchange',()=>location.reload());

/* init */
load();
if(/^#v1\./.test(location.hash))startViewer();
else{refreshDocSel();renderNav();renderForm();renderPreviewNow();syncExopt();}
</script>
</body>
</html>
